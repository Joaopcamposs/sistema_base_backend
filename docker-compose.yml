services:
  api:
    build:
      context: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
    environment:
      - IN_DOCKER=true

  celery_worker:
    build:
      context: .
    container_name: celery_worker
    command: celery -A infra.aplicacoes.celery.worker worker --loglevel=info
    depends_on:
      - redis
      - api
    environment:
      - C_FORCE_ROOT=true
      - IN_DOCKER=true

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "54322:5432"
