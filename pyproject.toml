[tool.poetry]
name = "sistema-base-backend"
version = "0.1.0"
description = ""
authors = ["joaopcamposs <joaopcamposs@outlook.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11"
sqlalchemy = ">=2.0.40,<3.0.0"
fastapi = {extras = ["all"], version = ">=0.115.12,<0.116.0"}
uvicorn = {extras = ["standard"], version = "^0.34.2"}
passlib = "^1.7.4"
validate-docbr = ">=1.10.0,<2.0.0"
ruff = ">=0.11.5,<0.12.0"
sentry-sdk = ">=2.25.1,<3.0.0"
requests = ">=2.32.3,<3.0.0"
celery = ">=5.5.1,<6.0.0"
redis = ">=5.2.1,<6.0.0"
eventlet = ">=0.39.1,<0.40.0"
asyncpg = ">=0.30.0,<0.31.0"
bcrypt = ">=4.3.0,<5.0.0"
mypy = "^1.15.0"
pre-commit = "^4.2.0"
pyjwt = "^2.10.1"
cryptography = "^44.0.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.packages]]
include = "contextos_de_negocio"

[[tool.poetry.packages]]
include = "infra"

[[tool.poetry.packages]]
include = "libs"
