[project]
name = "sistema-base-backend"
version = "0.1.0"
description = "Sistema Base Backend para diferentes sistemas de gestão de negócios"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "barramento-de-mensagens",
    "bcrypt>=4.3.0",
    "build>=1.3.0",
    "celery>=5.5.3",
    "cryptography>=45.0.6",
    "eventlet>=0.40.2",
    "fastapi[all]>=0.116.1",
    "httpx>=0.28.1",
    "mypy>=1.17.1",
    "passlib>=1.7.4",
    "pre-commit>=4.3.0",
    "pyjwt>=2.10.1",
    "pytest-asyncio>=1.1.0",
    "python-jose>=3.5.0",
    "redis>=6.4.0",
    "requests>=2.32.4",
    "ruff>=0.12.8",
    "sentry-sdk>=2.34.1",
    "twine>=6.1.0",
    "validate-docbr>=1.11.1",
]

[tool.uv.sources]
barramento-de-mensagens = { path = "libs/barramento_de_mensagens-0.1.4-py3-none-any.whl" }
