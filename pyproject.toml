[project]
name = "sistema-base-backend"
version = "0.1.0"
description = "Sistema Base Backend para diferentes sistemas de gestão de negócios"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "bcrypt>=4.3.0",
    "build>=1.3.0",
    "celery>=5.5.3",
    "cryptography>=45.0.6",
    "eventlet>=0.40.2",
    "fastapi[all]>=0.116.1",
    "httpx>=0.28.1",
    "mypy>=1.17.1",
    "passlib>=1.7.4",
    "pre-commit>=4.3.0",
    "pyjwt>=2.10.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=4.1.0",
    "python-jose>=3.5.0",
    "redis>=6.4.0",
    "requests>=2.32.4",
    "ruff>=0.12.8",
    "sentry-sdk>=2.34.1",
    "sqlalchemy>=2.0.43",
    "twine>=6.1.0",
    "validate-docbr>=1.11.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -W ignore::sqlalchemy.exc.SAWarning"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::sqlalchemy.exc.SAWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
