services:
  celery_worker_test:
    build:
      context: ../
    container_name: celery_worker_test
    command: celery -A infra.aplicacoes.celery worker --loglevel=info
    depends_on:
      - redis_test
    environment:
      - C_FORCE_ROOT=true
      - IN_DOCKER=true

  redis_test:
    image: redis:7
    container_name: redis_test
    ports:
      - "6379:6379"

  postgres_test_sbb:
    container_name: postgres_test_sbb
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5